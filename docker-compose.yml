version: '3.8'

services:
  # PostgreSQL Database
  database:
    image: postgres:16-alpine
    container_name: musicplatform-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-musicplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-musicplatform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-musicplatform}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js Application
  app:
    build:
      context: ./playlist-farm-app
      dockerfile: ../Dockerfile.app
    container_name: musicplatform-app
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./config.json:/app/config/config.json:ro
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-musicplatform}:${POSTGRES_PASSWORD:-changeme}@database:5432/${POSTGRES_DB:-musicplatform}

      # NextAuth
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}

      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

      # Spotify API
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      SPOTIFY_REDIRECT_URI: ${SPOTIFY_REDIRECT_URI}

      # Stripe
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}

      # Admin
      ADMIN_USERS: ${ADMIN_USERS}

      # Cron
      CRON_SECRET: ${CRON_SECRET}

      # Email
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
    ports:
      - "3000:3000"
    command: >
      sh -c "
        npx prisma migrate deploy &&
        node server.js
      "

  # Playlist Sync Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: musicplatform-worker
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./config.json:/config/config.json:ro
      - ./shared-config.ts:/app/shared-config.ts:ro
      - ./entrypoint-worker.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-musicplatform}:${POSTGRES_PASSWORD:-changeme}@database:5432/${POSTGRES_DB:-musicplatform}

      # Spotify API (for CLI tool)
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}

      # Node Environment
      NODE_ENV: production

      # Config path for TypeScript loader
      CONFIG_PATH: /config/config.json

volumes:
  postgres_data:
    driver: local
